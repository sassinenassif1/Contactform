<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="vGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="smileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Left V -->
  <path d="M40 60 L75 145 L88 145 L75 115 L60 60 Z"
        fill="url(#vGrad)" stroke="#cbd5e1" stroke-width="1.2"
        stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M75 145 L88 145 L75 115 Z" fill="#f1f5f9"/>

  <!-- Right V -->
  <path d="M95 60 L130 145 L143 145 L130 115 L115 60 Z"
        fill="url(#vGrad)" stroke="#cbd5e1" stroke-width="1.2"
        stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M130 145 L143 145 L130 115 Z" fill="#f1f5f9"/>

  <!-- Smile arc -->
  <path d="M130 55 Q160 35 175 65"
        stroke="url(#smileGrad)" stroke-width="14"
        stroke-linecap="round" fill="none" filter="url(#soft)"/>
</svg>
